<!DOCTYPE html>

        <nav class="page-header__nav">

              <a class="page-header__nav-link" href="#tours">О проекте</a>

            </li>
            <li class="page-header__nav-item">

            <li class="page-header__nav-item">
              <a class="page-header__nav-link" href="#contacts">Контакты</a>
            </li>
          </ul>
        </nav>

    <div data-test="hero">hero</div>
    <div data-test="about">about</div>
    <div data-test="programs">programs</div>
    <div data-test="grant">grant</div>
